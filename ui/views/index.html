<!DOCTYPE html>
<html lang="en">

<head>
    <meta chatset="UTF-8" />
    <title>Sperm Analyser</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <h1>Sperm Analyser</h1>

    <div class="input-section border-t">
        <h3>Select a folder with sperm images to process:</h3>
        <button class="bt-icon-alignment" onclick="selectFolder()">
            <img src="./assets/plus.svg" alt="plus icon">
            Add Folder
        </button>
        <div id="selected-folders">
            <p>No folders selected. Add a folder.</p>
        </div>
    </div>
    <div class="input-section border-t border-b">
        <h3>Processing options</h3>
        <div class="input-spacing">
            <label for="image-type">Image Type:</label>
            <select name="image-type" id="image-type"></select>
        </div>
        <div class="input-spacing">
            <label for="sperm-type">Sperm Type:</label>
            <select name="sperm-type" id="sperm-type">
                <option value="BULL">Bull</option>
                <option disabled value="GALLUS">Gallus</option>
            </select>
        </div>
        <div class="input-spacing">
            <input type="checkbox" disabled name="invert-segmented-images" id="invert-segmented-images">
            <label for="invert-segmented-images">Invert Segmented Images</label>
        </div>
        <div class="input-spacing">
            <label for="cut-edges-percentage">Crop Borders:</label>
            <br>
            <input type="range" id="cut-edges-percentage" min="0" max="10" value="0"
                oninput="this.nextElementSibling.value = `${this.value}%`">
            <output id="cut-edges-percentage-preview">0%</output>
        </div>
    </div>
    <button id="run-processing" class="bt-icon-alignment" onclick="runProcessing()">
        <img src="./assets/green-play.svg" alt="play icon">
        Run Processing
    </button>

    <p id="progress-text"></p>
    <div hidden id="progress-bar-section">
        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressLabel">0%</span>
    </div>

    <script src="index.js"></script>
</body>

</html>
