<!DOCTYPE html>
<html lang="en">

<head>
    <meta chatset="UTF-8" />
    <title>Image Processor</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <h1>Image processor</h1>

    <div class="input-section">
        <h3>Select a folder with images to process:</h3>
        <button onclick="selectFolder()">Select folder</button>
        <p id="folder-name"></p>
    </div>
    <div class="input-section">
        <h3>Processing options</h3>
        <div class="input-spacing">
            <label for="cut-edges-percentage">Cut Edges:</label>
            <input type="range" id="cut-edges-percentage" min="0" max="10" value="0"
                oninput="this.nextElementSibling.value = `${this.value}%`">
            <output id="cut-edges-percentage-preview">0%</output>
        </div>
        <div class="input-spacing">
            <input type="checkbox" name="invert-segmented-images" id="invert-segmented-images">
            <label for="invert-segmented-images">Invert Segmented Images</label>
        </div>
        <div class="input-spacing">
            <label for="sperm-type">Sperm Type:</label>
            <select name="sperm-type" id="sperm-type">
                <option value="BULL">Bull</option>
                <option disabled value="GALLUS">Gallus</option>
            </select>
        </div>
    </div>
    <button id="run-processing" onclick="runProcessing()">Run Processing</button>

    <p id="progress"></p>

    <script src="index.js"></script>
</body>

</html>
