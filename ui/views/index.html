<!DOCTYPE html>
<html lang="en">

<head>
    <meta chatset="UTF-8" />
    <title>Image Processor</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <h1>Image processor</h1>

    <div class="input-section">
        <p>Select a folder with images to process:</p>
        <button onclick="selectFolder()">Select folder</button>
        <p id="folder-name"></p>
    </div>
    <div class="input-section">
        <p>Processing options</p>
        <label for="cut-edges-percentage">Cut Edges:</label>
        <input type="range" id="cut-edges-percentage" min="0" max="30" value="0"
            oninput="this.nextElementSibling.value = `${this.value}%`">
        <output id="cut-edges-percentage-preview">0%</output>
    </div>
    <button id="run-processing" onclick="runProcessing()">Run Processing</button>

    <p id="progress"></p>

    <script src="index.js"></script>
</body>

</html>
